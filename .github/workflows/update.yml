name: Update Alumi Note

on:
  schedule:
    # UTC 22:00 = JST 7:00 に毎日実行
    - cron: "0 22 * * *"
  workflow_dispatch: {}  # 手動実行ボタンも使えるようにしておく

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest aluminum industry news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/fetch_news.py

      - name: Regenerate site
        run: python scripts/generate_site.py

      - name: Commit and push if changed
        run: |
          git config user.name "alumi-note-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ docs/
          git diff --cached --quiet || git commit -m "chore: 自動更新 $(date -u +'%Y-%m-%d')"
          git push
